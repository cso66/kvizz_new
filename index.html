<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kvíz vizualizációk 2024/25</title>
  <style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #333; line-height: 1.6;
  }
  .wrapper {
    max-width: 1400px; margin: 0 auto;
    background: white; border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1); overflow: hidden;
  }
  h1 {
    text-align: center; padding: 40px 20px 20px;
    margin: 0; font-size: 2.5em; color: #4a5568;
    background: rgba(255,255,255,0.9);
  }
  .row {
    display: flex; justify-content: center;
    gap: 20px; margin: 20px; flex-wrap: wrap;
  }
  .column {
    display: flex; flex-direction: column;
    align-items: center; gap: 30px; margin: 20px;
  }
  iframe {
    border: none; border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    transition: transform 0.3s, box-shadow 0.3s;
  }
  iframe:hover {
    transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  }
  .row iframe {
    flex: 1; min-width: 500px; height: 500px;
  }
  .column iframe {
  width: 100%;
  max-width: 1600px;  /* Pontosan a fig méret */
  height: 850px;      /* Fig height + padding */
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

/* Speciális animáció még nagyobb */
.column iframe[src*="animacio"] {
  max-width: 1600px !important;
  height: 900px !important;
}

  }
  /* Mobile */
  @media (max-width: 768px) {
    .row { flex-direction: column; }
    .row iframe, .column iframe { height: 400px; min-width: unset; }
  }
  
</style>
</head>
